<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>記帳雲 · 對帳中心</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f7f5f2;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}
.navbar{background:#fff!important}
.brand-icon{width:34px;height:34px;background:linear-gradient(135deg,#6a3a8a,#4a2a6a);border-radius:10px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:17px;margin-right:10px}
.navbar-brand{font-weight:700;color:#6a3a8a!important}
.nav-link.active{color:#6a3a8a!important;font-weight:600}
.card-list{background:#fff;border-radius:14px;padding:8px 22px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.stat-card{background:#fff;border-radius:14px;padding:18px 22px;box-shadow:0 2px 12px rgba(0,0,0,.05);text-align:center}
.stat-num{font-size:30px;font-weight:700}
.stat-ok .stat-num{color:#1a6a5a}
.stat-transit .stat-num{color:#b8860b}
.stat-diff .stat-num{color:#bf4a18}
.ev-row{padding:14px 0;border-bottom:1px solid #f0ece4}
.ev-row:last-child{border-bottom:0}
.src-badge{padding:3px 10px;border-radius:10px;font-size:12px;font-weight:600;background:#f0ece4;color:#555}
.src-pos{background:#eaf0fa;color:#1a4a8a}
.src-expense{background:#fdf0ea;color:#bf4a18}
.btn-primary{background:#6a3a8a;border-color:#6a3a8a}
.btn-primary:hover{background:#4a2a6a;border-color:#4a2a6a}
.detail-text{color:#888;font-size:13px}
</style>
</head>
<body>
<div id="navMount"></div>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h4 class="mb-0">對帳中心</h4>
    <div class="d-flex gap-2">
      <input type="date" id="datePick" class="form-control form-control-sm" style="width:160px">
      <button class="btn btn-sm btn-outline-secondary" id="loadBtn">查看</button>
      <button class="btn btn-sm btn-primary" id="runBtn">立刻重新對帳</button>
    </div>
  </div>
  <div id="topMsg" class="mb-3"></div>

  <div class="row g-3 mb-3">
    <div class="col-4"><div class="stat-card stat-ok"><div class="stat-num" id="nOk">–</div><div>對平</div></div></div>
    <div class="col-4"><div class="stat-card stat-transit"><div class="stat-num" id="nTransit">–</div><div>還在路上</div></div></div>
    <div class="col-4"><div class="stat-card stat-diff"><div class="stat-num" id="nDiff">–</div><div>有問題</div></div></div>
  </div>

  <div id="notRan" class="alert alert-warning d-none">這一天還沒有對過帳(或上次沒有跑成),所以下面的空白不代表沒問題。請按「立刻重新對帳」,系統也會在下一次自動重試。</div>

  <div class="card-list mb-3">
    <h6 class="pt-3 mb-1" style="color:#bf4a18">有問題(需要處理)</h6>
    <div id="diffList" class="text-muted py-3">尚未載入</div>
  </div>

  <div class="card-list mb-3">
    <h6 class="pt-3 mb-1" style="color:#b8860b">還在路上(排隊或等審核,先不用動)</h6>
    <div id="transitList" class="text-muted py-3">尚未載入</div>
  </div>

  <div class="card-list mb-3">
    <h6 class="pt-3 mb-1" style="color:#1a6a5a">對平</h6>
    <div id="okList" class="text-muted py-3">尚未載入</div>
  </div>

  <div class="card-list mb-3 d-none" id="reversedCard">
    <h6 class="pt-3 mb-1" style="color:#666">已作廢(原單被沖銷)</h6>
    <div id="reversedList" class="py-3"></div>
  </div>

  <div class="mb-2 d-none" id="staleToggle">
    <label class="small text-muted"><input type="checkbox" id="showStale"> 顯示現場已經沒有的舊紀錄(<span id="staleN">0</span> 筆)</label>
  </div>
  <div class="card-list mb-3 d-none" id="staleCard">
    <h6 class="pt-3 mb-1" style="color:#888">現場已經沒有的舊紀錄</h6>
    <div id="staleList" class="py-3"></div>
  </div>

  <div class="text-muted" style="font-size:12px" id="lastRun"></div>
</div>

<script src="/common.js"></script>
<script>
if (CC.initPage('reconcile')) {
  let openRepush = new Set();
  let myRole = null;
  let lastData = null;

  function srcBadge(src) {
    const cls = src === 'leo_pos' ? ' src-pos' : (src === 'leo_expense' ? ' src-expense' : '');
    return `<span class="src-badge${cls}">${esc(CC.sourceName(src))}</span>`;
  }

  function money(v) { return v == null ? '' : fmtMoney(v); }

  function rowHtml(ev, withRepush) {
    let btn = '';
    if (withRepush) {
      if (openRepush.has(ev.external_id)) {
        btn = '<button class="btn btn-sm btn-outline-secondary" disabled>補送中…</button>';
      } else if (ev.can_repush === true) {
        const lock = CC.can(myRole, 'write') ? '' : ' disabled title="你的角色只能查看,不能補送"';
        btn = `<button class="btn btn-sm btn-primary" data-act="repush" data-src="${esc(ev.external_source)}" data-ext="${esc(ev.external_id)}"${lock}>重新補送</button>`;
      } else {
        btn = '<span class="detail-text">要回原系統重新觸發</span>';
      }
    }
    return `<div class="ev-row" data-ext="${esc(ev.external_id)}"><div class="d-flex justify-content-between align-items-center flex-wrap gap-2">`
      + '<div>' + srcBadge(ev.external_source) + ` <strong class="ms-1">${esc(CC.eventName(ev.event_type))}</strong>`
      + ` <span class="text-muted" style="font-size:12px">單號 ${esc(ev.external_id)}</span>`
      + (ev.leo_amount != null ? ` <span class="ms-2">${esc(money(ev.leo_amount))}</span>` : '')
      + (ev.detail ? `<div class="detail-text">${esc(ev.detail)}</div>` : '')
      + `</div><div>${btn}</div></div></div>`;
  }

  function listOrEmpty(arr, withRepush, emptyHtml) {
    return arr && arr.length ? arr.map(e => rowHtml(e, withRepush)).join('') : emptyHtml;
  }

  // 後端的「這天有沒有跑過」:優先看 ran,其次 summary.ran,再來看有沒有上次時間
  function wasRun(data) {
    if (data.ran !== undefined) return data.ran !== false;
    if (data.summary && data.summary.ran !== undefined) return data.summary.ran !== false;
    return true;
  }

  function render(data) {
    lastData = data;
    openRepush = new Set((data.open_repush || []).map(r => r.external_id));
    const counts = data.counts || {};
    // 後端帶 include_stale=1 時,「現場清單已不再列出」的舊列混在各組裡(cloud_status='stale') → 抽出來另外放
    const raw = data.results || {};
    const isStale = (e) => e && e.cloud_status === 'stale';
    const g = {
      settled: (raw.settled || []).filter(e => !isStale(e)),
      in_transit: (raw.in_transit || []).filter(e => !isStale(e)),
      diff: (raw.diff || []).filter(e => !isStale(e)),
      reversed: raw.reversed || [],
      stale: (raw.stale || []).concat(
        (raw.settled || []).filter(isStale), (raw.in_transit || []).filter(isStale), (raw.diff || []).filter(isStale)),
    };
    const ran = wasRun(data);
    $('nOk').textContent = counts.settled != null ? counts.settled : (g.settled || []).length;
    $('nTransit').textContent = counts.in_transit != null ? counts.in_transit : (g.in_transit || []).length;
    $('nDiff').textContent = counts.diff != null ? counts.diff : (g.diff || []).length;
    $('notRan').classList.toggle('d-none', ran);

    $('diffList').innerHTML = listOrEmpty(g.diff, true,
      ran ? '<div class="py-3 text-muted">沒有問題 🎉</div>' : '<div class="py-3 text-muted">這一天還沒對過帳,不確定有沒有問題</div>');
    $('transitList').innerHTML = listOrEmpty(g.in_transit, false, '<div class="py-3 text-muted">無</div>');
    $('okList').innerHTML = listOrEmpty(g.settled, false,
      ran ? '<div class="py-3 text-muted">無</div>' : '<div class="py-3 text-muted">這一天還沒對過帳,按「立刻重新對帳」</div>');

    const rev = g.reversed || [];
    $('reversedCard').classList.toggle('d-none', rev.length === 0);
    $('reversedList').innerHTML = rev.map(e => rowHtml(e, false)).join('');

    const stale = g.stale || [];
    $('staleToggle').classList.toggle('d-none', stale.length === 0);
    $('staleN').textContent = stale.length;
    $('staleList').innerHTML = stale.map(e => rowHtml(e, false)).join('');
    $('staleCard').classList.toggle('d-none', stale.length === 0 || !$('showStale').checked);

    $('lastRun').textContent = data.last_run_at ? '上次對帳時間:' + fmtDateTime(data.last_run_at) : '這一天還沒跑過對帳';
  }

  async function load() {
    const date = $('datePick').value;
    if (!date) return;
    inlineResult($('topMsg'), true, '');
    try {
      const data = await api('/B/' + BOOK + '/reconciliation?include_stale=1&date=' + encodeURIComponent(date));
      render(data);
    } catch (e) {
      if (e.handled) return;
      inlineResult($('topMsg'), false, '讀取對帳結果失敗:' + e.message);
    }
  }

  async function runNow() {
    const date = $('datePick').value;
    if (!date) return;
    const btn = $('runBtn');
    btn.disabled = true; btn.textContent = '對帳中…';
    inlineResult($('topMsg'), true, '');
    try {
      await api('/B/' + BOOK + '/reconciliation/run', { method: 'POST', body: { date } });
      await load();
      inlineResult($('topMsg'), true, '✓ 已重新對帳');
    } catch (e) {
      if (e.handled) return;
      inlineResult($('topMsg'), false, '重新對帳沒有成功:' + e.message + '(現場系統可能暫時離線)');
    } finally {
      btn.disabled = false; btn.textContent = '立刻重新對帳';
    }
  }

  async function repush(src, extId, btn) {
    const row = btn.closest('.ev-row');
    btn.disabled = true; btn.textContent = '送出中…';
    try {
      await api('/B/' + BOOK + '/reconciliation/repush', {
        method: 'POST', body: { external_source: src, external_id: extId },
      });
      openRepush.add(extId);
      btn.textContent = '補送中…';
      inlineResult(row, true, '已排入補送,幾分鐘內會自動重送,稍後按上方「查看」確認結果');
    } catch (e) {
      if (e.handled) return;
      btn.disabled = false; btn.textContent = '重新補送';
      inlineResult(row, false, '補送沒有成功:' + e.message);
    }
  }

  $('diffList').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-act="repush"]');
    if (b && !b.disabled) repush(b.dataset.src, b.dataset.ext, b);
  });
  $('showStale').addEventListener('change', () => {
    $('staleCard').classList.toggle('d-none', !$('showStale').checked);
  });
  $('loadBtn').addEventListener('click', load);
  $('runBtn').addEventListener('click', runNow);

  // 預設昨天(台北時間)
  $('datePick').value = addDays(todayLocal(), -1);
  CC.onResume(() => {
    // 有補送結果或錯誤訊息正在看的時候不重抓,免得訊息被洗掉
    if (!document.querySelector('.cc-result')) load();
  });
  CC.loadRole().then((role) => { myRole = role; load(); });
}
</script>
</body>
</html>
