<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>記帳雲 · 登入</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f7f5f2;min-height:100vh;display:flex;align-items:center;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}
.login-card{max-width:380px;margin:0 auto;padding:36px 32px;background:#fff;border-radius:14px;box-shadow:0 2px 24px rgba(0,0,0,.08)}
.brand-icon{width:60px;height:60px;background:linear-gradient(135deg,#6a3a8a,#4a2a6a);border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px}
.brand-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px}
.brand-sub{font-size:13px;color:#888;text-align:center;margin-bottom:28px}
.form-label{font-size:13px;font-weight:500}
.btn-primary{background:#6a3a8a;border-color:#6a3a8a}
.btn-primary:hover{background:#4a2a6a;border-color:#4a2a6a}
.btn-primary:focus,.btn-primary:disabled{background:#6a3a8a;border-color:#6a3a8a}
</style>
</head>
<body>
<div class="container">
  <div class="login-card">
    <div class="brand-icon">📊</div>
    <div class="brand-title">記帳雲</div>
    <div class="brand-sub">公司記帳整合系統</div>
    <div id="err" class="alert alert-danger d-none small" role="alert"></div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">員工</label>
        <select class="form-select" id="empId" required>
          <option value="">載入中…</option>
        </select>
        <div class="form-text" id="empHint" style="font-size:11px">找不到自己？請聯絡 super_admin 在 HR /attendance 頁開通記帳雲權限</div>
      </div>
      <div class="mb-4">
        <label class="form-label">PIN 密碼</label>
        <input type="password" class="form-control" id="pin" required placeholder="4 碼以上" autocomplete="current-password" inputmode="numeric">
      </div>
      <button type="submit" class="btn btn-primary w-100" id="submitBtn" disabled>登入</button>
      <div class="text-center mt-3" style="font-size:11px;color:#888">
        帳號 / PIN 由 LEO HR 系統統一管理<br>
        改 PIN / 改權限請聯絡 super_admin
      </div>
    </form>
  </div>
</div>
<script>
if (localStorage.getItem('token')) location.href = '/dashboard';

// 載入員工下拉 (從記帳雲 proxy HR /api/auth/employees-roster, 已 filter cloud_access != none)
const ROLE_LABEL = { owner:'帳本擁有者', admin:'管理員', editor:'記帳員', viewer:'唯讀' };
async function loadEmployees() {
  const sel = document.getElementById('empId');
  const submitBtn = document.getElementById('submitBtn');
  const hint = document.getElementById('empHint');
  try {
    const r = await fetch('/auth/employees-roster');
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.error || `HTTP ${r.status}`);
    }
    const data = await r.json();
    const emps = data.employees || [];
    if (emps.length === 0) {
      sel.innerHTML = '<option value="">（無可登入員工）</option>';
      hint.textContent = '目前沒有員工被開通記帳雲權限，請聯絡 super_admin';
      hint.style.color = '#c4453a';
      return;
    }
    // 依部門分組
    const byDept = {};
    for (const e of emps) {
      const d = e.dept || '其他';
      if (!byDept[d]) byDept[d] = [];
      byDept[d].push(e);
    }
    // 按部門排序，加 saved emp_id (last used) 預選
    const lastEmpId = localStorage.getItem('lastEmpId') || '';
    let html = '<option value="">— 請選擇員工 —</option>';
    for (const dept of Object.keys(byDept).sort()) {
      html += `<optgroup label="${dept}">`;
      for (const e of byDept[dept]) {
        const sel = e.emp_id === lastEmpId ? ' selected' : '';
        const tag = ROLE_LABEL[e.cloud_access] || e.cloud_access;
        html += `<option value="${e.emp_id}" data-name="${e.name.replace(/"/g, '&quot;')}"${sel}>${e.name}　【${tag}】　${e.emp_id}</option>`;
      }
      html += '</optgroup>';
    }
    sel.innerHTML = html;
    submitBtn.disabled = false;
    if (lastEmpId) document.getElementById('pin').focus();
  } catch (err) {
    sel.innerHTML = `<option value="">（載入失敗）</option>`;
    hint.textContent = '無法連到 LEO HR 系統取得員工名單：' + err.message;
    hint.style.color = '#c4453a';
  }
}
loadEmployees();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const emp_id = document.getElementById('empId').value;
  const pin = document.getElementById('pin').value;
  if (!emp_id) { return; }
  const errBox = document.getElementById('err');
  const btn = document.getElementById('submitBtn');
  errBox.classList.add('d-none');
  btn.disabled = true; btn.textContent = '登入中...';
  try {
    const r = await fetch('/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ emp_id, pin }),
    });
    const data = await r.json();
    if (!r.ok) {
      errBox.textContent = data.error || '登入失敗';
      errBox.classList.remove('d-none');
      btn.disabled = false; btn.textContent = '登入';
      return;
    }
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    localStorage.setItem('lastEmpId', emp_id);  // 下次自動選回
    location.href = '/dashboard';
  } catch (err) {
    errBox.textContent = '連線錯誤: ' + err.message;
    errBox.classList.remove('d-none');
    btn.disabled = false; btn.textContent = '登入';
  }
});
</script>
</body>
</html>
