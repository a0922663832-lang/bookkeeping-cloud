<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>記帳雲 · 登入</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
<style>
body{background:#f7f5f2;min-height:100vh;display:flex;align-items:center;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}
.login-card{max-width:380px;margin:0 auto;padding:36px 32px;background:#fff;border-radius:14px;box-shadow:0 2px 24px rgba(0,0,0,.08)}
.brand-icon{width:60px;height:60px;background:linear-gradient(135deg,#6a3a8a,#4a2a6a);border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px}
.brand-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px}
.brand-sub{font-size:13px;color:#888;text-align:center;margin-bottom:28px}
.form-label{font-size:13px;font-weight:500}
.btn-primary{background:#6a3a8a;border-color:#6a3a8a}
.btn-primary:hover{background:#4a2a6a;border-color:#4a2a6a}
.btn-primary:focus,.btn-primary:disabled{background:#6a3a8a;border-color:#6a3a8a}
</style>
</head>
<body>
<div class="container">
  <div class="login-card">
    <div class="brand-icon">📊</div>
    <div class="brand-title">記帳雲</div>
    <div class="brand-sub">公司記帳整合系統</div>
    <div id="reason" class="alert alert-warning d-none small" role="alert"></div>
    <div id="err" class="alert alert-danger d-none small" role="alert"></div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">員工</label>
        <select class="form-select" id="empId" required>
          <option value="">載入中…</option>
        </select>
        <div class="form-text" id="empHint" style="font-size:11px">找不到自己?請找系統管理員,到人資系統的出勤頁幫你開通記帳雲權限</div>
        <button type="button" class="btn btn-outline-secondary btn-sm mt-2 d-none" id="retryBtn">重新載入名單</button>
      </div>
      <div class="mb-4">
        <label class="form-label">PIN 密碼</label>
        <input type="password" class="form-control" id="pin" required placeholder="4 碼以上" autocomplete="current-password" inputmode="numeric">
      </div>
      <button type="submit" class="btn btn-primary w-100" id="submitBtn" disabled>登入</button>
      <div class="text-center mt-3" style="font-size:11px;color:#888">
        帳號和 PIN 由人資系統統一管理<br>
        要改 PIN 或改權限,請找系統管理員
      </div>
    </form>
  </div>
</div>
<script src="/common.js"></script>
<script>
(function () {
  if (CC.getToken()) { CC.go('/dashboard'); return; }

  // 被踢回來的原因(登入過期、權限被收回…)
  try {
    const why = new URLSearchParams(location.search).get('reason');
    if (why) {
      const box = document.getElementById('reason');
      box.textContent = why;
      box.classList.remove('d-none');
    }
  } catch (_) { /* ignore */ }

  const ROLE_LABEL = CC.ROLE_NAME;
  const sel = document.getElementById('empId');
  const submitBtn = document.getElementById('submitBtn');
  const hint = document.getElementById('empHint');
  const retryBtn = document.getElementById('retryBtn');

  function setHint(text, bad) {
    hint.textContent = text;
    hint.style.color = bad ? '#c4453a' : '';
  }

  // 載入員工下拉(從記帳雲代取人資名單,只含有開通記帳雲權限的人)
  async function loadEmployees() {
    retryBtn.classList.add('d-none');
    submitBtn.disabled = true;
    sel.innerHTML = '<option value="">載入中…</option>';
    try {
      let r;
      try { r = await fetch('/auth/employees-roster'); }
      catch (_) { throw new Error('連線有問題,請檢查網路'); }
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        throw new Error(CC.friendlyError(r.status, d));
      }
      const data = await r.json();
      const emps = data.employees || [];
      if (emps.length === 0) {
        sel.innerHTML = '<option value="">(沒有可以登入的員工)</option>';
        setHint('目前沒有員工被開通記帳雲權限,請找系統管理員', true);
        return;
      }
      const byDept = {};
      for (const e of emps) {
        const d = e.dept || '其他';
        (byDept[d] = byDept[d] || []).push(e);
      }
      let lastEmpId = '';
      try { lastEmpId = localStorage.getItem('lastEmpId') || ''; } catch (_) { /* ignore */ }
      let html = '<option value="">— 請選擇員工 —</option>';
      for (const dept of Object.keys(byDept).sort()) {
        html += `<optgroup label="${esc(dept)}">`;
        for (const e of byDept[dept]) {
          const picked = e.emp_id === lastEmpId ? ' selected' : '';
          const tag = ROLE_LABEL[e.cloud_access] || '已開通';
          html += `<option value="${esc(e.emp_id)}"${picked}>${esc(e.name)}　【${esc(tag)}】　${esc(e.emp_id)}</option>`;
        }
        html += '</optgroup>';
      }
      sel.innerHTML = html;
      submitBtn.disabled = false;
      setHint('找不到自己?請找系統管理員,到人資系統的出勤頁幫你開通記帳雲權限', false);
      if (lastEmpId) document.getElementById('pin').focus();
    } catch (err) {
      sel.innerHTML = '<option value="">(名單載入失敗)</option>';
      setHint('沒辦法取得員工名單:' + err.message, true);
      retryBtn.classList.remove('d-none');
    }
  }
  retryBtn.addEventListener('click', loadEmployees);
  loadEmployees();

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const emp_id = sel.value;
    const pin = document.getElementById('pin').value;
    if (!emp_id) return;
    const errBox = document.getElementById('err');
    errBox.classList.add('d-none');
    submitBtn.disabled = true; submitBtn.textContent = '登入中...';
    try {
      const r = await fetch('/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ emp_id, pin, device_id: CC.deviceId() }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        let msg = CC.friendlyError(r.status, data);
        if (r.status === 401 && !CC.CJK.test(String(data.error || ''))) msg = '編號或密碼不對,請再試一次';
        errBox.textContent = msg;
        errBox.classList.remove('d-none');
        submitBtn.disabled = false; submitBtn.textContent = '登入';
        return;
      }
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      localStorage.setItem('lastEmpId', emp_id);  // 下次自動選回
      CC.go('/dashboard');
    } catch (err) {
      errBox.textContent = '連線有問題,請檢查網路後再試';
      errBox.classList.remove('d-none');
      submitBtn.disabled = false; submitBtn.textContent = '登入';
    }
  });
})();
</script>
</body>
</html>
