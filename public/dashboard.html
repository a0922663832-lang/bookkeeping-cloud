<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>記帳雲 · 儀表板</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
<style>
body{background:#f7f5f2;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}
.navbar{background:#fff!important}
.brand-icon{width:34px;height:34px;background:linear-gradient(135deg,#6a3a8a,#4a2a6a);border-radius:10px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:17px;margin-right:10px}
.navbar-brand{font-weight:700;color:#6a3a8a!important}
.nav-link.active{color:#6a3a8a!important;font-weight:600}
.kpi-card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,.05);height:100%}
.kpi-label{font-size:13px;color:#888;margin-bottom:8px}
.kpi-value{font-size:28px;font-weight:700;color:#1a1814}
.kpi-value.pos{color:#1a6a5a}
.kpi-value.neg{color:#c4453a}
.section-card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,.05);margin-top:20px}
.acct-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #f0ece4}
.acct-row:last-child{border-bottom:0}
.acct-type-badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;background:#f3eafa;color:#6a3a8a;margin-left:6px}
.todo-link{color:#888;font-size:13px;text-decoration:none}
.todo-link:hover{color:#6a3a8a}
</style>
</head>
<body>
<div id="navMount"></div>

<div class="container py-4">
  <div id="loading" class="text-center text-muted py-5">載入中...</div>
  <div id="content" class="d-none">
    <h4 class="mb-3" id="monthLabel">本月概覽</h4>
    <div id="pageMsg"></div>
    <div id="pendingNotice"></div>

    <div class="row g-3">
      <div class="col-md-3"><div class="kpi-card">
        <div class="kpi-label">本月收入</div>
        <div class="kpi-value pos" id="kpiIncome">—</div>
      </div></div>
      <div class="col-md-3"><div class="kpi-card">
        <div class="kpi-label">本月支出</div>
        <div class="kpi-value neg" id="kpiExpense">—</div>
      </div></div>
      <div class="col-md-3"><div class="kpi-card">
        <div class="kpi-label">本月利潤</div>
        <div class="kpi-value" id="kpiProfit">—</div>
      </div></div>
      <div class="col-md-3"><div class="kpi-card">
        <div class="kpi-label">總帳戶餘額</div>
        <div class="kpi-value" id="kpiBalance">—</div>
      </div></div>
    </div>

    <div class="section-card">
      <h6 class="mb-3">近 6 月趨勢</h6>
      <canvas id="trendChart" height="90"></canvas>
      <div id="chartMsg" class="text-muted small d-none">圖表載不出來(店內連不上外網),上面的數字不受影響。</div>
    </div>

    <div class="row g-3 mt-1">
      <div class="col-md-7"><div class="section-card mt-0">
        <h6 class="mb-3">資金帳戶餘額</h6>
        <div id="accountsList"></div>
      </div></div>
      <div class="col-md-5"><div class="section-card mt-0">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="mb-0">待審入帳</h6>
          <a href="/pending" class="btn btn-sm btn-outline-primary">前往審核 →</a>
        </div>
        <div id="pendingList" class="small">載入中...</div>
      </div></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous"></script>
<script src="/common.js"></script>
<script>
if (CC.initPage('dashboard')) {
  let trendChart = null;

  function typeName(t) { return ({ income: '收入', expense: '支出', transfer: '轉帳', reclassify: '重分類', composite: '複式' })[t] || '其他'; }

  async function loadDash() {
    try {
      const [d, pj] = await Promise.all([
        api(`/B/${BOOK}/reports/dashboard`),
        api(`/B/${BOOK}/pending-journals?status=pending&limit=5`),
      ]);
      $('monthLabel').textContent = `${d.month} 概覽`;
      $('kpiIncome').textContent = fmtMoney(d.this_month.income);
      $('kpiExpense').textContent = fmtMoney(d.this_month.expense);
      const profit = parseFloat(d.this_month.profit);
      const pE = $('kpiProfit');
      pE.textContent = fmtMoney(profit);
      pE.classList.remove('pos', 'neg');
      pE.classList.add(profit >= 0 ? 'pos' : 'neg');
      $('kpiBalance').textContent = fmtMoney(d.total_balance);
      CC.pendingNotice($('pendingNotice'), d.pending);

      $('accountsList').innerHTML = (d.accounts || []).length
        ? d.accounts.map(a => `<div class="acct-row"><span>${esc(a.name)}<span class="acct-type-badge">${esc(CC.ACCT_TYPE_NAME[a.type] || '其他')}</span></span><strong>${fmtMoney(a.current_balance)}</strong></div>`).join('')
        : '<div class="text-muted small">尚無帳戶</div>';

      const total = pj.total != null ? pj.total : pj.count;
      $('pendingList').innerHTML = (pj.count > 0)
        ? pj.pending_journals.slice(0, 4).map(p => {
            const j = p.proposed_journal || {};
            return `<div class="acct-row"><span><strong>${esc(typeName(j.type))}</strong> ${fmtMoney(CC.pendingAmount(p))}<br><small class="text-muted">${esc(CC.sourceName(p.external_source))} · ${esc(j.summary || '')}</small></span></div>`;
          }).join('') + (total > 4 ? `<div class="text-muted pt-2">還有 ${esc(total - 4)} 筆,到「待審」查看</div>` : '')
        : '<div class="text-success">✓ 沒有待審項目</div>';

      // 外網元件沒載入(或畫圖出錯)時,圖表位置改顯示白話說明,其餘照常
      let chartOk = typeof Chart !== 'undefined';
      if (chartOk) {
        try {
        if (trendChart) trendChart.destroy();
        trendChart = new Chart($('trendChart'), {
          type: 'line',
          data: {
            labels: d.trend_6m.map(t => t.month),
            datasets: [
              { label: '收入', data: d.trend_6m.map(t => parseFloat(t.income)), borderColor: '#1a6a5a', backgroundColor: 'rgba(26,106,90,.1)', fill: true, tension: 0.3 },
              { label: '支出', data: d.trend_6m.map(t => parseFloat(t.expense)), borderColor: '#c4453a', backgroundColor: 'rgba(196,69,58,.1)', fill: true, tension: 0.3 },
              { label: '利潤', data: d.trend_6m.map(t => parseFloat(t.profit)), borderColor: '#6a3a8a', borderWidth: 2, tension: 0.3 },
            ],
          },
          options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true } } },
        });
        } catch (_) { chartOk = false; }
      }
      $('trendChart').classList.toggle('d-none', !chartOk);
      $('chartMsg').classList.toggle('d-none', chartOk);

      $('loading').classList.add('d-none');
      $('content').classList.remove('d-none');
      inlineResult($('pageMsg'), true, '');
    } catch (e) {
      if (e.handled) return;
      if (!$('content').classList.contains('d-none')) {
        inlineResult($('pageMsg'), false, '更新失敗:' + e.message);
      } else {
        $('loading').innerHTML = '<div class="alert alert-danger">載入失敗:' + esc(e.message) + '</div>';
      }
    }
  }

  CC.onResume(loadDash);
  loadDash();
}
</script>
</body>
</html>
