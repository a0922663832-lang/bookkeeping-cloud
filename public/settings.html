<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>記帳雲 · 設定</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
<style>
body{background:#f7f5f2;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}
.navbar{background:#fff!important}
.brand-icon{width:34px;height:34px;background:linear-gradient(135deg,#6a3a8a,#4a2a6a);border-radius:10px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:17px;margin-right:10px}
.navbar-brand{font-weight:700;color:#6a3a8a!important}
.nav-link.active{color:#6a3a8a!important;font-weight:600}
.btn-primary{background:#6a3a8a;border-color:#6a3a8a}
.btn-primary:hover{background:#4a2a6a;border-color:#4a2a6a}
.btn-outline-primary{color:#6a3a8a;border-color:#6a3a8a}
.section-card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.05);margin-bottom:20px}
.section-title{font-size:17px;font-weight:600;margin-bottom:6px;color:#1a1814}
.section-sub{font-size:12px;color:#888;margin-bottom:18px}
.field-label{font-size:12px;color:#666;font-weight:500}
.read-only-banner{background:#fff8e1;border:1px solid #ffeaa7;border-radius:8px;padding:10px 14px;font-size:13px;color:#7a5d00;margin-bottom:16px}
.current-badge{display:inline-block;padding:3px 10px;background:#d1e7dd;color:#0a3622;border-radius:8px;font-size:12px;font-weight:600}
.mode-auto{background:#fff3cd;color:#856404}
.mode-manual{background:#fdeae8;color:#a94a3a}
.empty-state{padding:30px;text-align:center;color:#888}
table.mode-table{width:100%;font-size:14px}
table.mode-table th{background:#faf8f5;font-weight:600;font-size:12px;color:#666;padding:9px 10px;border-bottom:2px solid #e8e2d5}
table.mode-table td{padding:11px 10px;border-bottom:1px solid #f0ece4}
.soon{font-size:11px;color:#888;margin-top:3px}
</style>
</head>
<body>
<div id="navMount"></div>

<div class="container py-4" style="max-width:860px">
  <h5 class="mb-3">系統設定</h5>

  <div id="readOnlyBanner" class="read-only-banner d-none">
    ⚠ 你目前的角色是 <strong id="myRoleName">—</strong>,不能修改設定。要改請找帳本擁有者或管理員。
  </div>
  <div id="loading" class="empty-state">載入中...</div>

  <div id="content" class="d-none">
    <!-- 帳本資料 -->
    <div class="section-card" id="bookCard">
      <div class="section-title">帳本資料</div>
      <div class="section-sub">基本資訊。改完按底下「儲存帳本資料」一次送出。</div>

      <div class="row g-3">
        <div class="col-md-4">
          <label class="field-label">帳本代碼</label>
          <input type="text" class="form-control" id="fCode" readonly>
        </div>
        <div class="col-md-8">
          <label class="field-label">帳本名稱 *</label>
          <input type="text" class="form-control" id="fName" maxlength="50">
        </div>
        <div class="col-md-7">
          <label class="field-label">公司全名</label>
          <input type="text" class="form-control" id="fCompany" maxlength="100" placeholder="例 花現鳥巢餐廳有限公司">
        </div>
        <div class="col-md-5">
          <label class="field-label">統編</label>
          <input type="text" class="form-control" id="fTaxId" maxlength="8" pattern="\d{8}" placeholder="8 碼">
        </div>
        <div class="col-md-4">
          <label class="field-label">幣別</label>
          <select class="form-select" id="fCurrency" disabled>
            <option value="TWD">TWD 台幣</option>
            <option value="USD">USD 美元</option>
            <option value="JPY">JPY 日圓</option>
            <option value="CNY">CNY 人民幣</option>
            <option value="HKD">HKD 港幣</option>
            <option value="EUR">EUR 歐元</option>
          </select>
          <div class="soon">尚未啟用(目前一律用台幣)</div>
        </div>
        <div class="col-md-4">
          <label class="field-label">會計年度起月</label>
          <select class="form-select" id="fFiscalMonth" disabled>
            <option value="1">1 月(曆年制)</option>
            <option value="4">4 月(學年制)</option>
            <option value="7">7 月</option>
            <option value="10">10 月</option>
          </select>
          <div class="soon">尚未啟用(年報目前固定 1–12 月)</div>
        </div>
        <div class="col-md-4 d-flex align-items-end">
          <button class="btn btn-primary w-100" id="saveBookBtn">💾 儲存帳本資料</button>
        </div>
      </div>
    </div>

    <!-- 關帳 -->
    <div class="section-card" id="closeCard">
      <div class="section-title">關帳</div>
      <div class="section-sub">
        關帳日以前的帳不能再改。要解鎖按「取消關帳」,或把日期往前調。已經交給會計師的月份,建議關到那個月的月底。
      </div>
      <div id="closeOwner" class="d-none">
        <div class="row g-3 align-items-end">
          <div class="col-md-5">
            <label class="field-label">關帳到</label>
            <input type="date" class="form-control" id="fClosed">
          </div>
          <div class="col-md-4">
            <button class="btn btn-primary w-100" id="saveCloseBtn">🔒 儲存關帳日</button>
          </div>
          <div class="col-md-3">
            <button class="btn btn-outline-danger w-100" id="cancelCloseBtn">取消關帳</button>
          </div>
        </div>
        <div class="soon">關帳日不能晚於今天。</div>
      </div>
      <div id="closeText" class="d-none"></div>
    </div>

    <!-- 記帳模式(只顯示) -->
    <div class="section-card" id="modeCard">
      <div class="section-title">各來源怎麼入帳</div>
      <div class="section-sub">
        現場系統送來的資料,會依下表處理。這些由技術端設定,要改請告訴技術。
      </div>
      <div style="overflow-x:auto">
        <table class="mode-table">
          <thead><tr><th>來源</th><th>目前怎麼處理</th></tr></thead>
          <tbody id="modeRows"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
if (CC.initPage('settings')) {
  let bookData = null;
  let myRole = null;

  // 來源 / 事件 / 白話名稱(對照 posting.js 的 resolvePostingMode 讀法)
  const SOURCES = [
    { source: 'leo_pos', event: 'pos_shift_settled', label: 'POS 收班' },
    { source: 'leo_pos', event: 'pos_deposit_offset', label: '訂金抵用' },
    { source: 'leo_pos', event: 'pos_deposit_offset_return', label: '訂金抵用退回(整單退款)' },
    { source: 'leo_expense', event: 'expense_created', label: '支出單' },
    { source: 'leo_inventory', event: null, label: '進貨' },
    { source: 'leo_inline', event: null, label: '訂金 / 刷卡撥款' },
    { source: 'leo_hr', event: null, label: '薪資' },
  ];

  // 回 { mode, inherited }:沒有個別設定就是跟著全域
  function resolveMode(book, source, event) {
    const cfg = book.posting_mode_per_source || {};
    const v = cfg[source];
    if (typeof v === 'string') return { mode: v, inherited: false };
    if (v && typeof v === 'object') {
      // 反向事件沒有自己的設定,跟著原事件走(對照 posting.js 的 EVENT_MODE_ALIAS)
      const alias = event === 'pos_deposit_offset_return' ? 'pos_deposit_offset' : null;
      const m = (event && v[event]) || (alias && v[alias]) || v._default;
      if (m) return { mode: m, inherited: false };
    }
    return { mode: book.posting_mode || 'review', inherited: true };
  }

  function modeBadge(mode) {
    const text = CC.MODE_TEXT[mode] || '未知設定';
    const cls = mode === 'auto' ? ' mode-auto' : mode === 'manual' ? ' mode-manual' : '';
    return `<span class="current-badge${cls}">${esc(text)}</span>`;
  }

  async function load() {
    try {
      const r = await CC.getBook(true);
      bookData = r.book;
      myRole = r.my_role;
      render();
    } catch (e) {
      if (e.handled) return;
      $('loading').innerHTML = `<div class="text-danger">載入失敗:${esc(e.message)}</div>`;
    }
  }

  function render() {
    $('loading').classList.add('d-none');
    $('content').classList.remove('d-none');
    const canEdit = CC.can(myRole, 'admin');
    if (!canEdit) {
      $('readOnlyBanner').classList.remove('d-none');
      $('myRoleName').textContent = CC.ROLE_NAME[myRole] || '未知角色';
    }
    $('fCode').value = bookData.code || '';
    $('fName').value = bookData.name || '';
    $('fCompany').value = bookData.company_name || '';
    $('fTaxId').value = bookData.tax_id || '';
    $('fCurrency').value = bookData.currency || 'TWD';
    $('fFiscalMonth').value = bookData.fiscal_year_start_month || 1;
    if (!canEdit) {
      ['fName', 'fCompany', 'fTaxId'].forEach((id) => { $(id).disabled = true; });
      CC.lockBtn($('saveBookBtn'), '只有帳本擁有者或管理員能修改');
    }

    renderClose(true);
    renderModes();
  }

  // 關帳:只有帳本擁有者看得到日期欄和儲存鈕,其他人只看文字。refreshInput = false 時不動正在輸入的欄位
  function renderClose(refreshInput) {
    const isOwner = myRole === 'owner';
    const closed = CC.closedOf({ book: bookData });
    $('closeOwner').classList.toggle('d-none', !isOwner);
    $('closeText').classList.toggle('d-none', isOwner);
    $('closeText').textContent = closed ? `目前關帳到 ${closed}(只有帳本擁有者能修改)` : '尚未關帳(只有帳本擁有者能設定)';
    if (isOwner && refreshInput) $('fClosed').value = closed || '';
    $('fClosed').max = CC.todayLocal();            // 關帳日不能是未來(台北日期)
    $('cancelCloseBtn').disabled = !closed;         // 沒關帳就沒有東西可取消
    $('cancelCloseBtn').title = closed ? '' : '目前沒有關帳';
  }

  // 唯讀表:每個來源目前的真實處理方式
  function renderModes() {
    const rows = SOURCES.map((s) => {
      const r = resolveMode(bookData, s.source, s.event);
      return `<tr><td>${esc(s.label)}</td><td>${modeBadge(r.mode)}${r.inherited ? ' <span class="text-muted small">(跟著全域)</span>' : ''}</td></tr>`;
    });
    rows.push(`<tr><td><strong>全域預設</strong><div class="text-muted small">沒有個別設定的來源就照這個</div></td><td>${modeBadge(bookData.posting_mode || 'review')}</td></tr>`);
    $('modeRows').innerHTML = rows.join('');
  }

  async function saveBookData() {
    const card = $('bookCard');
    const name = $('fName').value.trim();
    if (!name) { inlineResult(card, false, '帳本名稱一定要填'); return; }
    const taxId = $('fTaxId').value.trim();
    if (taxId && !/^\d{8}$/.test(taxId)) { inlineResult(card, false, '統編必須是 8 碼數字'); return; }
    // 幣別與會計年度起月尚未啟用,不送
    const payload = {
      name,
      company_name: $('fCompany').value.trim() || null,
      tax_id: taxId || null,
    };
    const btn = $('saveBookBtn'); btn.disabled = true; btn.textContent = '儲存中...';
    inlineResult(card, true, '');
    try {
      const r = await api(`/B/${BOOK}`, { method: 'PATCH', body: payload });
      bookData = r.book || bookData;
      inlineResult(card, true, '✓ 帳本資料已儲存');
    } catch (e) {
      if (e.handled) return;
      inlineResult(card, false, '儲存失敗:' + e.message);
    } finally {
      btn.disabled = false; btn.textContent = '💾 儲存帳本資料';
    }
  }

  // 把關帳日設成 val(YYYY-MM-DD 或 null = 取消關帳)
  async function sendClosed(val, btn) {
    const card = $('closeCard');
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = '儲存中...';
    inlineResult(card, true, '');
    try {
      const r = await api(`/B/${BOOK}`, { method: 'PATCH', body: { closed_through: val } });
      bookData = Object.assign({}, bookData, r.book || {}, { closed_through: val });
      if (!val) $('fClosed').value = '';
      inlineResult(card, true, val ? `✓ 已關帳到 ${val}` : '✓ 已取消關帳');
    } catch (e) {
      if (e.handled) return;
      inlineResult(card, false, '儲存失敗:' + e.message);
    } finally {
      btn.disabled = false; btn.textContent = label;
      renderClose(false);      // 取消鈕要依最新狀態決定能不能按
    }
  }

  async function saveClosed() {
    const card = $('closeCard');
    const v = $('fClosed').value.trim();
    if (v && !/^\d{4}-\d{2}-\d{2}$/.test(v)) { inlineResult(card, false, '日期格式不對,請重新選一次'); return; }
    if (v && v > CC.todayLocal()) { inlineResult(card, false, '關帳日不能晚於今天'); return; }
    sendClosed(v || null, $('saveCloseBtn'));
  }

  // iOS 的日期欄不一定有「清除」,所以另外給一顆明確的取消鈕
  async function cancelClosed() {
    const go = await ask({ title: '取消關帳?', text: '確定取消關帳?取消後以前的帳又可以改了。', okText: '取消關帳', cancelText: '先不要', danger: true });
    if (!go) return;
    sendClosed(null, $('cancelCloseBtn'));
  }

  $('saveBookBtn').addEventListener('click', saveBookData);
  $('saveCloseBtn').addEventListener('click', saveClosed);
  $('cancelCloseBtn').addEventListener('click', cancelClosed);
  // 切回來時只更新下面的唯讀表,不動上面可能正在輸入的欄位
  CC.onResume(() => {
    CC.getBook(true).then((r) => { bookData = r.book; renderClose(false); renderModes(); }).catch(() => {});
  });
  load();
}
</script>
</body>
</html>
