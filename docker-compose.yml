version: "3.8"

services:
  app:
    build: .
    container_name: bookkeeping-cloud-app
    ports:
      - "3001:3001"
    environment:
      TZ: Asia/Taipei                  # D26：強制台北時區
      DATABASE_URL: postgres://nest:${POSTGRES_PASSWORD:-nestpass}@postgres:5432/bookkeeping
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me_64chars_minimum_aaaaaaaaaaaaaaaaaaaaaaa}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-changeme}
      # HR SSO (2026-05-13, plan: drifting-toasting-corbato.md)
      HR_BASE_URL: ${HR_BASE_URL:-http://10.0.1.168:3000}
      HR_DEFAULT_BOOK_CODE: ${HR_DEFAULT_BOOK_CODE:-NEST0001}
      LEGACY_EMAIL_LOGIN: ${LEGACY_EMAIL_LOGIN:-false}
      # D16: 環境分離
      LINE_NOTIFY_TOKEN: ${LINE_NOTIFY_TOKEN:-}
      LINE_NOTIFY_TOKEN_STAGING: ${LINE_NOTIFY_TOKEN_STAGING:-}
      # Phase 0 對帳中心：雲端要主動簽名打 LEO 端點，secret 必須傳進 container
      # （沒設時收推送是 dev-mode 放行 — 上線後務必在 .env 設值）
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:-}
      # 對帳差異手機通知（ntfy topic 完整網址，可不設 → 只記 log）
      NTFY_URL: ${NTFY_URL:-}
      # LEO 端位址（對帳拉取用）
      LEO_BASE_URL: ${LEO_BASE_URL:-http://10.0.1.168:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./public:/app/public
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: bookkeeping-cloud-postgres
    environment:
      TZ: Asia/Taipei                  # D26
      PGTZ: Asia/Taipei                # D26: postgres client default tz
      POSTGRES_USER: nest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nestpass}
      POSTGRES_DB: bookkeeping
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nest -d bookkeeping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bookkeeping-cloud-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
